[project]
name = "sistema-video-ai-automatico"
version = "0.1.0"
description = "Sistema automatico per la generazione di video con AI (tutto gratuito/open-source)"
authors = []
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "celery>=5.4",
    "redis>=5.2",
    "gTTS>=2.5",
    "moviepy>=2.1",
    "Pillow>=11.1",
    "opencv-python-headless>=4.10",
    "python-multipart>=0.0.19",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "srt>=3.5",
    "httpx>=0.28",
]

[project.scripts]
video-ai = "app.main:run"
video-worker = "app.workers.celery_app:run_worker"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
