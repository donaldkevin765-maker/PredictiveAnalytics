services:
  api:
    build:
      context: ./sistema-video-ai-automatico
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ./sistema-video-ai-automatico/.env
    volumes:
      - ./sistema-video-ai-automatico/app:/app/app
      - ./sistema-video-ai-automatico/output:/app/output
      - ./sistema-video-ai-automatico/data:/app/data
    depends_on:
      redis:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./sistema-video-ai-automatico
      dockerfile: Dockerfile
    env_file: ./sistema-video-ai-automatico/.env
    volumes:
      - ./sistema-video-ai-automatico/app:/app/app
      - ./sistema-video-ai-automatico/output:/app/output
      - ./sistema-video-ai-automatico/data:/app/data
    depends_on:
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  beat:
    build:
      context: ./sistema-video-ai-automatico
      dockerfile: Dockerfile
    env_file: ./sistema-video-ai-automatico/.env
    volumes:
      - ./sistema-video-ai-automatico/data:/app/data
    depends_on:
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app beat --loglevel=info

  flower:
    build:
      context: ./sistema-video-ai-automatico
      dockerfile: Dockerfile
    env_file: ./sistema-video-ai-automatico/.env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_started
    command: celery -A app.workers.celery_app flower --port=5555

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
